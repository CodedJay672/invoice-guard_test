<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>InvoiceGuard - Payment Intelligence for UK Businesses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:  #0A0A0A;
  --white:  #FFFFFF;
  --grey1:  #F5F5F5;
  --grey2:  #EBEBEB;
  --grey3:  #D4D4D4;
  --grey4:  #A3A3A3;
  --grey5:  #737373;
  --grey6:  #525252;
  --emerald:#12D6A0;
  --em2:    #0FBB8A;
  --red:    #EF4444;
  --amber:  #F59E0B;
  --green:  #22C55E;
  --purple: #8B5CF6;
}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:var(--white);
  color:var(--black);
  font-size:16px;
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}


@media(max-width:960px){
  .fdr-row{grid-template-columns:1fr;gap:40px;}
  .fdr-row.reverse{direction:ltr;}
  .fdr-section{padding:48px 20px;}
  .fdr-row{padding:48px 0;gap:32px;}
}

/* ── ANIMATIONS ── */
.reveal{opacity:0;transform:translateY(20px);transition:opacity 0.6s ease,transform 0.6s ease;}
.reveal.v{opacity:1;transform:translateY(0);}
.d1{transition-delay:0.08s;}.d2{transition-delay:0.16s;}.d3{transition-delay:0.24s;}.d4{transition-delay:0.32s;}

/* ── RESPONSIVE ── */
@media(max-width:960px){
  .mockup-body{grid-template-columns:1fr;}.mock-sidebar{display:none;}
  .feat-grid,.how-grid{grid-template-columns:1fr 1fr;}
  .feat-card:nth-child(2n){border-right:none;}
  .feat-card:nth-child(3){border-right:1px solid var(--grey2);}
  .feat-card:nth-child(3),.feat-card:nth-child(4){border-bottom:1px solid var(--grey2);}
  .feat-card:nth-child(5),.feat-card:nth-child(6){border-bottom:none;}
  .testi-grid{grid-template-columns:1fr;}
  .pain-inner{grid-template-columns:1fr;gap:48px;}
  .pricing-grid{grid-template-columns:repeat(2,1fr);}
  .stats-grid-small{grid-template-columns:repeat(2,1fr);}
  .sgsc:nth-child(2n){border-right:none;}
  .sgsc:nth-child(1),.sgsc:nth-child(2){padding-bottom:28px;border-bottom:1px solid var(--grey2);}
  .footer-top{grid-template-columns:1fr 1fr;gap:32px;}
}
@media(max-width:600px){
  nav{padding:0 20px;}
  .nav-links{display:none;}
  .hero,.features-section,.how-section,.pain-section,.testi-section,.pricing-section,.faq-section,.final-cta,.stats-section,.trust-strip,.marquee-section{padding-left:20px;padding-right:20px;}
  .feat-grid,.how-grid{grid-template-columns:1fr;}
  .feat-card{border-right:none!important;border-bottom:1px solid var(--grey2)!important;}
  .feat-card:last-child{border-bottom:none!important;}
  .how-card{border-right:none;border-bottom:1px solid var(--grey2);}
  .how-card:last-child{border-bottom:none;}
  .pricing-grid{grid-template-columns:1fr;}
  .footer-top{grid-template-columns:1fr;}
  footer{padding:40px 20px 0;}
  h1{letter-spacing:-2.5px;}
  .stat-big{letter-spacing:-3px;}
  .hero-deco{display:none;}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<script>
// NAV
window.addEventListener("scroll",()=>{document.getElementById("nav").classList.toggle("scrolled",window.scrollY>40);});

// TYPING on final search
const companies=["Nexora Digital Solutions Ltd","BuildRight Contractors UK Ltd","Swift Logistics Group Ltd","Meridian Care Services Ltd","Apex Print and Design Ltd"];
let ci=0,ci2=0,del=false,act=true;
const heroInp=document.getElementById("hero-input");
const finalInp=document.getElementById("final-input");
function type(){if(!act||!heroInp)return;const cur=companies[ci];if(!del){heroInp.placeholder=cur.slice(0,ci2+1)+"|";ci2++;if(ci2===cur.length){del=true;setTimeout(type,1800);return;}}else{heroInp.placeholder=cur.slice(0,ci2-1)+(ci2>1?"|":"");ci2--;if(ci2===0){del=false;ci=(ci+1)%companies.length;}}setTimeout(type,del?40:72);}
type();
if(heroInp){heroInp.addEventListener("focus",()=>{act=false;heroInp.placeholder="Search a company name or number...";});}

// SCROLL REVEAL
const revs=document.querySelectorAll(".reveal");
const ro=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting)x.target.classList.add("v");});},{threshold:0.1});
revs.forEach(r=>ro.observe(r));

// COUNTER
function animCounter(el){
  const target=parseFloat(el.dataset.target),dec=parseInt(el.dataset.decimals)||0,suf=el.dataset.suffix||"",steps=55;
  let s=0;
  function easeOut(t){return 1-Math.pow(1-t,3);}
  const timer=setInterval(()=>{s++;const p=easeOut(s/steps),cur=target*p;el.textContent=(dec>0?cur.toFixed(dec):Math.floor(cur))+suf;if(s>=steps){el.textContent=(dec>0?target.toFixed(dec):target)+suf;clearInterval(timer);}},1800/steps);
}
const ctrs=document.querySelectorAll(".counter"),done=new Set();
const co=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting&&!done.has(x.target)){done.add(x.target);const i=Array.from(ctrs).indexOf(x.target);setTimeout(()=>animCounter(x.target),i*100);}});},{threshold:0.5});
ctrs.forEach(c=>co.observe(c));

// FAQ
function toggleFaq(btn){const item=btn.closest(".faq-item"),open=item.classList.contains("open");document.querySelectorAll(".faq-item").forEach(i=>i.classList.remove("open"));if(!open)item.classList.add("open");}

// SMOOTH SCROLL
document.querySelectorAll('a[href^="#"]').forEach(a=>{a.addEventListener("click",e=>{const t=document.querySelector(a.getAttribute("href"));if(t){e.preventDefault();t.scrollIntoView({behavior:"smooth",block:"start"});}});});
</script>
</body>
</html>
