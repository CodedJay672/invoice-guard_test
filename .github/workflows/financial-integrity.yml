name: Financial integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  financial-postgresql:
    name: Financial PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run mandatory financial integration tests
        run: npm run test:financial:strict --workspace=api
      - name: Typecheck affected workspaces
        run: npm run typecheck -- --filter=api --filter=worker --filter=@workspace/db
      - name: Lint affected workspaces
        run: npm run lint -- --filter=api --filter=worker --filter=@workspace/db
